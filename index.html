<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Jet Engine AR</title>
    <meta
      name="description"
      content="Place a jet engine in your space with WebXR."
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="app">
      <header class="hero">
        <p class="brand">Jet Engine AR</p>
        <h1>Place the engine in your room</h1>
        <p class="sub">
          Chrome on Android · allow camera · aim at the floor · tap to place
        </p>
        <div id="ar-button-slot"></div>
        <p id="status" class="status" role="status"></p>
      </header>
    </main>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
