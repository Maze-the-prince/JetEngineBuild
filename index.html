<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ArApp | Jet Engine AR</title>
    <meta
      name="description"
      content="WebAR version of ArApp — place the jet engine on a real surface."
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="app">
      <header class="hero">
        <p class="brand">ArApp</p>
        <h1>Jet Engine AR</h1>
        <p class="sub">
          Same flow as the app: Enter AR → scan a flat surface → engine
          auto-places. Tap to move. Pinch to scale / twist to rotate.
        </p>
        <div id="ar-button-slot"></div>
        <p id="status" class="status" role="status">
          AR App: Waiting for WebXR manager...
        </p>
      </header>
    </main>
    <div id="hud" class="hud" aria-live="polite"></div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
