<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ArApp | Jet Engine AR</title>
    <meta
      name="description"
      content="WebAR version of ArApp — place the turbofan jet engine on a real surface."
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main id="app">
      <header class="hero">
        <p class="brand">ArApp</p>
        <h1>Jet Engine AR</h1>
        <p class="sub">
          Use <strong>Chrome</strong> on Android. Enter AR → point at a flat
          surface → tap to place. Auto-places after 8 seconds if needed.
        </p>
        <div id="ar-button-slot"></div>
        <p id="status" class="status" role="status">AR App: Starting…</p>
      </header>
    </main>
    <div id="hud" class="hud" aria-live="polite"></div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
