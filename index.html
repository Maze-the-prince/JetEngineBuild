<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ArApp | Jet Engine AR</title>
    <meta
      name="description"
      content="WebAR port of ArApp — place and inspect the turbofan jet engine."
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main id="app">
      <header class="hero">
        <p class="brand">ArApp</p>
        <h1>Jet Engine AR</h1>
        <p class="sub">
          Chrome on Android · Enter AR · aim at a flat surface · tap to place
          the Unity turbofan · tap parts to inspect
        </p>
        <div id="ar-button-slot"></div>
        <p id="status" class="status" role="status">AR App: Starting…</p>
        <button id="parts-reset" type="button" class="text-btn">
          Reset parts
        </button>
      </header>
    </main>

    <div id="hud" class="hud" aria-live="polite"></div>

    <aside id="part-panel" class="part-panel" hidden>
      <div class="part-panel-inner">
        <h2 id="part-title">Part</h2>
        <p id="part-desc"></p>
        <div class="part-actions">
          <button id="part-hide" type="button">Hide part</button>
          <button id="part-close" type="button" class="ghost">Close</button>
        </div>
      </div>
    </aside>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
