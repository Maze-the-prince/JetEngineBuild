<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ArApp | Jet Engine AR (Needle)</title>
    <meta
      name="description"
      content="Needle Engine WebAR port of ArApp — place the turbofan jet engine."
    />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1220;
        font-family: "Segoe UI", "Helvetica Neue", sans-serif;
        color: #f4f7fb;
      }
      needle-engine {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .overlay {
        position: fixed;
        left: 12px;
        right: 12px;
        top: 12px;
        z-index: 20;
        pointer-events: none;
      }
      .card {
        max-width: 460px;
        margin: 0 auto;
        padding: 14px 16px;
        border-radius: 14px;
        background: rgba(8, 14, 24, 0.78);
        border: 1px solid rgba(57, 198, 255, 0.28);
        backdrop-filter: blur(8px);
        pointer-events: auto;
      }
      .brand {
        margin: 0 0 6px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #39c6ff;
        font-size: 0.78rem;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }
      p {
        margin: 0;
        color: #a9b7c9;
        font-size: 0.92rem;
        line-height: 1.4;
      }
      .ar-session-active .overlay {
        opacity: 0.15;
      }
    </style>
  </head>
  <body>
    <div class="overlay desktop ar">
      <div class="card">
        <p class="brand">ArApp · Needle Engine</p>
        <h1>Jet Engine AR</h1>
        <p>
          Chrome on Android · tap <strong>AR</strong> · point at a flat surface
          · tap to place the turbofan (same flow as the Unity app).
        </p>
      </div>
    </div>

    <!-- Needle loads the exported Unity turbofan scene -->
    <needle-engine
      src="./jet-engine.glb"
      background-color="#0b1220"
      loading-style="light"
    ></needle-engine>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
