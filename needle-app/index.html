<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ArApp | Jet Engine AR (Needle)</title>
    <meta
      name="description"
      content="Needle Engine WebAR port of ArApp — place and inspect the turbofan jet engine."
    />
    <style>
      :root {
        --ink: #f4f7fb;
        --muted: #d7e2ee;
        --accent: #39c6ff;
        --accent-ink: #041018;
        --danger: #ff7b72;
        --ok: #6dffa8;
        --warn: #ffd166;
        --panel: rgba(4, 12, 22, 0.72);
        --panel-strong: rgba(4, 12, 22, 0.88);
        --font: "Segoe UI", "Helvetica Neue", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1220;
        color: var(--ink);
        font-family: var(--font);
      }

      needle-engine {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* ---- AR / desktop DOM overlay (must live inside <needle-engine>) ---- */
      .ar-ui {
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        font-family: var(--font);
        color: var(--ink);
      }

      .ar-ui * {
        pointer-events: none;
      }

      .ar-ui button,
      .ar-ui .interactive {
        pointer-events: auto;
      }

      .ar-top {
        position: absolute;
        left: 12px;
        right: 12px;
        top: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .ar-card {
        width: min(100%, 420px);
        padding: 12px 14px;
        border-radius: 14px;
        background: var(--panel);
        border: 1px solid rgba(57, 198, 255, 0.35);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
      }

      .brand {
        margin: 0 0 4px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
        font-size: 0.72rem;
      }

      .ar-card h1 {
        margin: 0 0 6px;
        font-size: 1.15rem;
        font-weight: 700;
      }

      .sub {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.35;
      }

      .status {
        margin: 0;
        min-height: 1.2em;
        font-size: 0.84rem;
        color: var(--muted);
      }

      .status.ok {
        color: var(--ok);
      }
      .status.error {
        color: var(--danger);
      }
      .status.warn {
        color: var(--warn);
      }

      .ar-toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 10px;
      }

      .ar-toolbar button,
      .part-actions button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 10px 14px;
        font-size: 0.86rem;
        font-weight: 700;
        color: var(--accent-ink);
        background: linear-gradient(180deg, #7adbff, var(--accent));
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(57, 198, 255, 0.25);
      }

      .ar-toolbar button.ghost,
      .part-actions button.ghost {
        background: rgba(255, 255, 255, 0.08);
        color: var(--ink);
        border: 1px solid rgba(244, 247, 251, 0.28);
        box-shadow: none;
      }

      .ar-bottom {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 18px;
        display: flex;
        justify-content: center;
      }

      #hud {
        width: min(100%, 420px);
        margin: 0;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(4, 10, 18, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #f4f7fb;
        font-size: 0.82rem;
        line-height: 1.35;
        text-align: center;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      #part-panel {
        width: min(100%, 420px);
      }

      #part-panel[hidden] {
        display: none !important;
      }

      .part-panel-inner {
        pointer-events: auto;
        padding: 14px 16px;
        border-radius: 14px;
        background: var(--panel-strong);
        border: 1px solid rgba(57, 198, 255, 0.35);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .part-panel-inner h2 {
        margin: 0 0 6px;
        font-size: 1.05rem;
      }

      .part-panel-inner p {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.4;
      }

      .part-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* Desktop landing: keep instructions + toolbar */
      .only-ar {
        display: none;
      }

      /* Immersive AR: compact HUD like Unity ArApp
         Needle puts .ar-session-active on <needle-engine>; we also set it on body. */
      .ar-session-active .desktop-only,
      needle-engine.ar-session-active .desktop-only {
        display: none !important;
      }

      .ar-session-active .only-ar,
      needle-engine.ar-session-active .only-ar {
        display: block;
      }

      .ar-session-active #hud,
      needle-engine.ar-session-active #hud {
        opacity: 1;
      }

      .ar-session-active .ar-card,
      needle-engine.ar-session-active .ar-card {
        padding: 10px 12px;
        background: rgba(4, 12, 22, 0.55);
      }

      .ar-session-active .ar-card h1,
      needle-engine.ar-session-active .ar-card h1 {
        font-size: 1rem;
        margin-bottom: 4px;
      }

      .ar-session-active .ar-toolbar,
      needle-engine.ar-session-active .ar-toolbar {
        margin-top: 8px;
      }

      /* While placing: keep status visible; hide part tools until placed */
      body.finding-ground .ar-toolbar {
        opacity: 0.35;
      }

      body.placed .ar-toolbar {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!--
      UI MUST be children of <needle-engine> so Needle's WebXR DOM Overlay
      shows it during immersive-ar (Android Chrome).
    -->
    <needle-engine
      src="./jet-engine.glb"
      background-color="#0b1220"
      loading-style="light"
      autoplay
    >
      <div class="ar-ui desktop ar" id="ar-ui">
        <div class="ar-top">
          <div class="ar-card interactive">
            <p class="brand">ArApp · Needle Engine</p>
            <h1>Jet Engine AR</h1>
            <p class="sub desktop-only">
              Chrome on Android · Enter AR · aim at a flat surface · tap to place
              (auto-places after 8s) · tap parts to inspect, hide, or reset.
            </p>
            <p class="sub only-ar" id="ar-hint">
              Point at a flat surface, then tap to place the engine.
            </p>
            <p id="status" class="status" role="status">AR App: Starting…</p>
            <div class="ar-toolbar">
              <button id="parts-show-all" type="button" class="ghost">
                Show all
              </button>
              <button id="parts-reset" type="button" class="ghost">
                Reset parts
              </button>
            </div>
          </div>

          <aside id="part-panel" hidden>
            <div class="part-panel-inner interactive">
              <h2 id="part-title">Part</h2>
              <p id="part-desc"></p>
              <div class="part-actions">
                <button id="part-hide" type="button">Hide part</button>
                <button id="part-close" type="button" class="ghost">Close</button>
              </div>
            </div>
          </aside>
        </div>

        <div class="ar-bottom">
          <p id="hud" aria-live="polite"></p>
        </div>
      </div>
    </needle-engine>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
