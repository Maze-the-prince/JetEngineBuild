<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ArApp | Jet Engine AR (Needle)</title>
    <meta
      name="description"
      content="Needle Engine WebAR port of ArApp — place and inspect the turbofan jet engine."
    />
    <style>
      :root {
        --bg0: #0b1220;
        --bg1: #152238;
        --ink: #f4f7fb;
        --muted: #a9b7c9;
        --accent: #39c6ff;
        --accent-ink: #041018;
        --danger: #ff7b72;
        --ok: #6dffa8;
        --warn: #ffd166;
        --panel: rgba(8, 14, 24, 0.88);
        --font: "Segoe UI", "Helvetica Neue", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(1200px 700px at 10% -10%, #1d3b63 0%, transparent 55%),
          radial-gradient(900px 600px at 100% 0%, #0f2a2f 0%, transparent 50%),
          linear-gradient(160deg, var(--bg0), var(--bg1));
        color: var(--ink);
        font-family: var(--font);
      }

      needle-engine {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      #hero {
        position: fixed;
        left: 12px;
        right: 12px;
        top: 12px;
        z-index: 20;
        pointer-events: none;
      }

      .card {
        max-width: 460px;
        margin: 0 auto;
        padding: 14px 16px;
        border-radius: 14px;
        background: var(--panel);
        border: 1px solid rgba(57, 198, 255, 0.28);
        backdrop-filter: blur(8px);
        pointer-events: auto;
      }

      .brand {
        margin: 0 0 6px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
        font-size: 0.78rem;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }

      .sub {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.4;
      }

      .status {
        margin: 0;
        min-height: 1.25em;
        font-size: 0.88rem;
        color: var(--muted);
      }

      .status.ok {
        color: var(--ok);
      }
      .status.error {
        color: var(--danger);
      }
      .status.warn {
        color: var(--warn);
      }

      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      .toolbar button,
      .part-actions button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 0.88rem;
        font-weight: 700;
        color: var(--accent-ink);
        background: linear-gradient(180deg, #7adbff, var(--accent));
        cursor: pointer;
      }

      .toolbar button.ghost,
      .part-actions button.ghost {
        background: transparent;
        color: var(--ink);
        border: 1px solid rgba(244, 247, 251, 0.25);
      }

      #hud {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 18px;
        z-index: 25;
        margin: 0;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(4, 10, 18, 0.55);
        color: #f4f7fb;
        font-size: 0.82rem;
        line-height: 1.35;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      body.ar-session-active #hero .card .sub,
      body.ar-session-active #hero .toolbar {
        display: none;
      }

      body.ar-session-active #hud {
        opacity: 1;
      }

      #part-panel {
        position: fixed;
        left: 12px;
        right: 12px;
        top: 16px;
        z-index: 30;
        pointer-events: none;
      }

      #part-panel[hidden] {
        display: none !important;
      }

      .part-panel-inner {
        pointer-events: auto;
        max-width: 420px;
        margin: 0 auto;
        padding: 14px 16px;
        border-radius: 14px;
        background: var(--panel);
        border: 1px solid rgba(57, 198, 255, 0.25);
        backdrop-filter: blur(10px);
      }

      .part-panel-inner h2 {
        margin: 0 0 6px;
        font-size: 1.1rem;
      }

      .part-panel-inner p {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.4;
      }

      .part-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <div id="hero">
      <div class="card">
        <p class="brand">ArApp · Needle Engine</p>
        <h1>Jet Engine AR</h1>
        <p class="sub">
          Chrome on Android · Enter AR · aim at a flat surface · tap to place
          (auto-places after 8s) · tap parts to inspect, hide, or reset.
        </p>
        <p id="status" class="status" role="status">AR App: Starting…</p>
        <div class="toolbar">
          <button id="parts-show-all" type="button" class="ghost">Show all</button>
          <button id="parts-reset" type="button" class="ghost">Reset parts</button>
        </div>
      </div>
    </div>

    <p id="hud" class="hud" aria-live="polite"></p>

    <aside id="part-panel" hidden>
      <div class="part-panel-inner">
        <h2 id="part-title">Part</h2>
        <p id="part-desc"></p>
        <div class="part-actions">
          <button id="part-hide" type="button">Hide part</button>
          <button id="part-close" type="button" class="ghost">Close</button>
        </div>
      </div>
    </aside>

    <needle-engine
      src="./jet-engine.glb"
      background-color="#0b1220"
      loading-style="light"
      autoplay
    ></needle-engine>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
